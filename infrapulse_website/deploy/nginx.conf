# InfraPulse Reverse Proxy Configuration for Nginx
# Handles REST API, WebSockets (/ws), large photo uploads, and SSL termination

# Rate limiting zone (optional, protects against brute force)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Redirect all HTTP traffic to HTTPS (uncomment after obtaining SSL cert)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Connection mapping for WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

